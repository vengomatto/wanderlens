<div class="feedback">
  <div class="fb-row">
    {% for action in ['like', 'save', 'dislike', 'skip'] %}
    <button type="button"
      class="fb fb-{{ action }}{% if feedback_action == action %} active{% endif %}"
      hx-post="/destinations/{{ destination_id | urlencode }}/feedback?action={{ action }}&token={{ post_token }}"
      hx-target="closest .feedback" hx-swap="outerHTML">{{ action }}</button>
    {% endfor %}
  </div>
  <div class="fb-reasons">
    {% for reason in ['too touristy', 'too far', 'not my vibe', 'been there'] %}
    <button type="button" class="fb fb-reason"
      hx-post="/destinations/{{ destination_id | urlencode }}/feedback?action=dislike&reason={{ reason | urlencode }}&token={{ post_token }}"
      hx-target="closest .feedback" hx-swap="outerHTML">{{ reason }}</button>
    {% endfor %}
  </div>
</div>
