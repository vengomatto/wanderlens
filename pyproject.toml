[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wanderlens"
version = "0.1.0"
description = "Learn a travel taste profile from a personal photo archive and recommend new destinations."
requires-python = ">=3.11"
dependencies = [
    "Pillow",
    "requests",
    "PyYAML",
    "numpy",
]

[project.optional-dependencies]
embeddings = ["onnxruntime", "tokenizers"]
dev = ["pytest", "piexif"]

[project.scripts]
wanderlens = "wanderlens.cli.main:main"

[tool.setuptools.packages.find]
include = ["wanderlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
